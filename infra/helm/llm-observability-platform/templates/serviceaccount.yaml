{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | kebabcase }}
  labels:
    {{- include "llm-observability.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | kebabcase }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

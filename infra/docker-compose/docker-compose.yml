name: llm_observability
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm_observability
      POSTGRES_USER: llm_observability
      POSTGRES_PASSWORD: llm_observability
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_observability -d llm_observability"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
    volumes:
      - ../migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners: INTERNAL for container-to-container, EXTERNAL for host access
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://:9092,PLAINTEXT_EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9094:9094"  # host access port (changed from 9092 to avoid conflict)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ../observability/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      ANALYTICS_API_INTERNAL_BASE: http://analytics-query:8081
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ANALYTICS_API_BASE: /analytics/api
    ports:
      - "3000:3000"

  inference-gateway:
    build:
      context: ../..
      dockerfile: services/inference-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/llm_observability
      SPRING_R2DBC_USERNAME: llm_observability
      SPRING_R2DBC_PASSWORD: llm_observability
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/llm_observability
      SPRING_FLYWAY_USER: llm_observability
      SPRING_FLYWAY_PASSWORD: llm_observability
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFERENCE_KAFKA_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  analytics-query:
    build:
      context: ../..
      dockerfile: services/analytics-query/Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/llm_observability
      SPRING_R2DBC_USERNAME: llm_observability
      SPRING_R2DBC_PASSWORD: llm_observability
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: llm_observability
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8081:8081"
    depends_on:
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started

  ingestion-worker:
    build:
      context: ../..
      dockerfile: services/ingestion-worker/Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/llm_observability
      SPRING_R2DBC_USERNAME: llm_observability
      SPRING_R2DBC_PASSWORD: llm_observability
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/llm_observability
      SPRING_FLYWAY_USER: llm_observability
      SPRING_FLYWAY_PASSWORD: llm_observability
      SPRING_FLYWAY_TABLE: ingestion_worker_flyway_schema_history
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGESTION_KAFKA_ENABLED: "true"
      INGESTION_CLICKHOUSE_ENABLED: "true"
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: llm_observability
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-password}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      otel-collector:
        condition: service_started

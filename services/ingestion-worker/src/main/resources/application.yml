spring:
  application:
    name: ingestion-worker
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/llm_observability}
    username: ${SPRING_R2DBC_USERNAME:llm_observability}
    password: ${SPRING_R2DBC_PASSWORD:llm_observability}
    pool:
      initial-size: 5
      max-size: 20
      max-life-time: PT10M
      max-idle-time: PT5M
    properties:
      connectTimeout: PT5S
      statementTimeout: 10s
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/llm_observability}
    user: ${SPRING_FLYWAY_USER:llm_observability}
    password: ${SPRING_FLYWAY_PASSWORD:llm_observability}
    table: ${SPRING_FLYWAY_TABLE:ingestion_worker_flyway_schema_history}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${INGESTION_KAFKA_GROUP_ID:ingestion-worker}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  service: ingestion-worker
  phase: inference-logging-pipeline

llm-observability:
  ingestion:
    kafka:
      enabled: ${INGESTION_KAFKA_ENABLED:false}
      lifecycle-topic: ${INFERENCE_LIFECYCLE_TOPIC:inference.lifecycle.v1}
      group-id: ${INGESTION_KAFKA_GROUP_ID:ingestion-worker}
    clickhouse:
      enabled: ${INGESTION_CLICKHOUSE_ENABLED:false}
      base-url: ${CLICKHOUSE_HTTP_URL:http://localhost:8123}
      database: ${CLICKHOUSE_DATABASE:llm_observability}
      lifecycle-table: ${CLICKHOUSE_INFERENCE_LIFECYCLE_TABLE:inference_lifecycle_fact}
      username: ${CLICKHOUSE_USERNAME:default}
      password: ${CLICKHOUSE_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} level=%level thread=%thread logger=%logger{36} msg=%msg%n"

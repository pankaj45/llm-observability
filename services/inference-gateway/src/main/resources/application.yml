spring:
  application:
    name: inference-gateway
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/llm_observability}
    username: ${SPRING_R2DBC_USERNAME:llm_observability}
    password: ${SPRING_R2DBC_PASSWORD:llm_observability}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/llm_observability}
    user: ${SPRING_FLYWAY_USER:llm_observability}
    password: ${SPRING_FLYWAY_PASSWORD:llm_observability}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  service: inference-gateway
  phase: inference-gateway-mvp

llm-observability:
  inference:
    stream-heartbeat: ${INFERENCE_STREAM_HEARTBEAT:PT15S}
    active-stream-ttl: ${INFERENCE_ACTIVE_STREAM_TTL:PT10M}
  redaction:
    enabled: ${PII_REDACTION_ENABLED:true}
    categories: ${PII_REDACTION_CATEGORIES:EMAIL,PHONE,CREDIT_CARD,SSN,IP_ADDRESS,AADHAAR}
  context:
    enabled: ${CONTEXT_ORCHESTRATOR_ENABLED:true}
    timezone: ${CONTEXT_TIMEZONE:Asia/Kolkata}
    tool-timeout: ${CONTEXT_TOOL_TIMEOUT:PT5S}
    market-data-cache-ttl: ${CONTEXT_MARKET_DATA_CACHE_TTL:PT60S}
    web-search-cache-ttl: ${CONTEXT_WEB_SEARCH_CACHE_TTL:PT10M}
    web-search-max-results: ${CONTEXT_WEB_SEARCH_MAX_RESULTS:5}
    tavily:
      enabled: ${TAVILY_ENABLED:true}
      api-key: ${TAVILY_API_KEY:}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    coin-gecko:
      enabled: ${COINGECKO_ENABLED:true}
      base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    default-model: ${GEMINI_DEFAULT_MODEL:gemini-2.5-flash}
  kafka:
    enabled: ${INFERENCE_KAFKA_ENABLED:false}
    lifecycle-topic: ${INFERENCE_LIFECYCLE_TOPIC:inference.lifecycle.v1}
  security:
    enabled: ${SECURITY_ENABLED:false}
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8090/realms/llm-observability}
    audience: ${OIDC_AUDIENCE:llm-observability-platform}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} level=%level thread=%thread logger=%logger{36} msg=%msg%n"

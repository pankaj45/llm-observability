spring:
  application:
    name: analytics-query
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/llm_observability}
    username: ${SPRING_R2DBC_USERNAME:llm_observability}
    password: ${SPRING_R2DBC_PASSWORD:llm_observability}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  service: analytics-query
  phase: analytics-and-operator-ui

llm-observability:
  analytics:
    clickhouse:
      enabled: ${ANALYTICS_CLICKHOUSE_ENABLED:true}
      base-url: ${CLICKHOUSE_HTTP_URL:http://localhost:8123}
      username: ${CLICKHOUSE_USERNAME:default}
      password: ${CLICKHOUSE_PASSWORD:}
      database: ${CLICKHOUSE_DATABASE:llm_observability}
      lifecycle-table: ${CLICKHOUSE_LIFECYCLE_TABLE:inference_lifecycle_fact}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=${spring.application.name} traceId=%X{traceId:-} spanId=%X{spanId:-} level=%level thread=%thread logger=%logger{36} msg=%msg%n"
